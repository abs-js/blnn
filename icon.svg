<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Don't Let Fall!">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#333333"/>
    </linearGradient>
    <linearGradient id="ball" x1="0.3" y1="0.1" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="55%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="plat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#sky)"/>
  <circle cx="28" cy="26" r="10" fill="#fff" opacity="0.9"/>
  <circle cx="38" cy="28" r="14" fill="#fff" opacity="0.85"/>
  <circle cx="96" cy="22" r="8" fill="#fff" opacity="0.7"/>
  <rect x="10" y="102" width="108" height="16" rx="4" fill="#94a3b8"/>
  <rect x="10" y="98" width="108" height="8" rx="3" fill="#cbd5e1"/>
  <rect x="22" y="70" width="36" height="10" rx="3" fill="url(#plat)" filter="url(#s)"/>
  <rect x="70" y="58" width="36" height="10" rx="3" fill="url(#plat)" filter="url(#s)"/>
  <g filter="url(#s)">
    <ellipse cx="64" cy="40" rx="18" ry="22" fill="url(#ball)"/>
    <ellipse cx="57" cy="32" rx="7" ry="9" fill="#fff" opacity="0.45"/>
    <path d="M64 62 q2 8 0 16" fill="none" stroke="#9f1239" stroke-width="2" stroke-linecap="round"/>
  </g>
  <circle cx="64" cy="40" r="3" fill="#fff" opacity="0.35"/>
