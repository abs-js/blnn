<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Don't Let Fall!</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
  :root {
    --blue: #2563eb;
    --orange: #ea580c;
    --ink: #0f172a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #020617;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: #e2e8f0; touch-action: none; user-select: none;
  }
  #wrap {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; background: #0ea5e9; max-width: 100%; max-height: 100%; }
  #hud {
    position: fixed; inset: 0; pointer-events: none;
  }
  #ui {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #ui .panel {
    pointer-events: auto;
    background: linear-gradient(180deg, rgba(15,23,42,.92), rgba(15,23,42,.86));
    border: 2px solid rgba(255,255,255,.12);
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    border-radius: 22px;
    padding: 28px 26px 24px;
    width: min(420px, calc(100vw - 28px));
    text-align: center;
    backdrop-filter: blur(10px);
  }
  h1 {
    margin: 0 0 6px; font-size: 34px; letter-spacing: -0.5px;
    background: linear-gradient(90deg, #38bdf8, #fb7185, #fb923c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: #94a3b8; margin: 0 0 18px; font-size: 14px; }
  button.menu {
    display: block; width: 100%; margin: 8px 0; padding: 12px 16px;
    border: 0; border-radius: 12px; font-size: 16px; font-weight: 700;
    cursor: pointer; color: #0f172a; background: #e2e8f0;
  }
  button.menu.primary { background: #38bdf8; }
  button.menu.p1 { background: #60a5fa; }
  button.menu.p2 { background: #fb923c; }
  button.menu.ghost { background: transparent; color: #cbd5e1; border: 1px solid rgba(255,255,255,.15); }
  button.menu:active { transform: scale(.98); }
  input.id {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid #334155;
    background: #0b1220; color: #f8fafc; font-size: 15px; margin: 8px 0 4px; text-align: center;
  }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  .hint { font-size: 12px; color: #94a3b8; line-height: 1.4; margin-top: 10px; text-align: left; }
  .peerid { font-family: ui-monospace, monospace; background: #0b1220; padding: 8px; border-radius: 8px; word-break: break-all; }
  #touch {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
  }
  .stick-base, .btn-act {
    pointer-events: auto; position: absolute; border-radius: 999px;
  }
  #stickBase {
    left: 28px; bottom: 28px; width: 128px; height: 128px;
    background: rgba(15,23,42,.35); border: 2px solid rgba(255,255,255,.22);
  }
  #stickKnob {
    position: absolute; width: 58px; height: 58px; border-radius: 999px;
    background: rgba(226,232,240,.9); left: 35px; top: 35px;
    box-shadow: 0 6px 16px rgba(0,0,0,.3);
  }
  #btnJump {
    right: 28px; bottom: 28px; width: 86px; height: 86px;
    background: rgba(56,189,248,.82); border: 2px solid rgba(255,255,255,.35);
    color: #0f172a; font-weight: 800; display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  #btnUse {
    right: 122px; bottom: 42px; width: 72px; height: 72px;
    background: rgba(251,146,60,.86); border: 2px solid rgba(255,255,255,.35);
    color: #0f172a; font-weight: 800; display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  #btnDive {
    right: 34px; bottom: 126px; width: 68px; height: 68px;
    background: rgba(244,114,182,.88); border: 2px solid rgba(255,255,255,.35);
    color: #0f172a; font-weight: 800; display: flex; align-items: center; justify-content: center;
    font-size: 11px;
  }
  #btnPause {
    pointer-events: auto; position: fixed; top: 14px; right: 14px; z-index: 8;
    width: 46px; height: 46px; border-radius: 12px; border: 2px solid rgba(255,255,255,.28);
    background: rgba(15,23,42,.62); color: #e2e8f0; font-weight: 800; font-size: 16px;
    cursor: pointer;
  }
  .hidden { display: none !important; }
  #toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(15,23,42,.85); padding: 8px 14px; border-radius: 999px;
    font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .2s;
    z-index: 20;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<div id="hud"></div>
<div id="ui"></div>
<div id="touch" class="hidden">
  <div id="stickBase" class="stick-base"><div id="stickKnob"></div></div>
  <div id="btnJump" class="btn-act">PULAR</div>
  <div id="btnUse" class="btn-act">TOCAR</div>
  <div id="btnDive" class="btn-act">MERGULHO</div>
</div>
<button id="btnPause" class="hidden">II</button>
<div id="toast"></div>
<script>
(() => {
  const W = 1280, H = 720;
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const ui = document.getElementById("ui");
  const toastEl = document.getElementById("toast");
  const touchLayer = document.getElementById("touch");
  const stickBase = document.getElementById("stickBase");
  const stickKnob = document.getElementById("stickKnob");
  const btnJump = document.getElementById("btnJump");
  const btnUse = document.getElementById("btnUse");
  const btnDive = document.getElementById("btnDive");
  const btnPause = document.getElementById("btnPause");
  const COLORS = [
    { name: "Azul", fill: "#3b82f6", dark: "#1d4ed8", light: "#93c5fd" },
    { name: "Laranja", fill: "#f97316", dark: "#c2410c", light: "#fdba74" }
  ];
  const STATE = { MENU: "menu", GAME: "game", RESULT: "result" };
  const JUDGE = {
    SALVAMENTO: { label: "Salvamento!", pts: 160, color: "#fde047" },
    DEFESA: { label: "Defesa!", pts: 120, color: "#67e8f9" },
    MERGDEFESA: { label: "Mergulho de defesa!", pts: 170, color: "#f9a8d4" },
    CONTROLE: { label: "Controle de balão", pts: 50, color: "#93c5fd" },
    DOWNSMASH: { label: "Down smash!", pts: 180, color: "#fb7185" },
    PEGADAALTA: { label: "Pegada alta", pts: 90, color: "#c4b5fd" },
    SALVOBAIXO: { label: "Salvo por baixo!", pts: 140, color: "#86efac" },
    COSTAS: { label: "De costas!", pts: 110, color: "#fdba74" }
  };
  let screen = STATE.MENU;
  let mode = "pve";
  let difficulty = "medio";
  let selectedStage = 0;
  let selectedMinutes = 2;
  let formOpt = false;
  let groundPopOpt = false;
  let paused = false;
  let stageNext = "start-pve";
  let localIndex = 0;
  let isHost = true;
  let peer = null, conn = null, myPeerId = "";
  let netReady = false;
  let lastSent = 0;
  const keys = Object.create(null);
  const joy = { x: 0, y: 0, active: false };
  let jumpHeld = false, useHeld = false, diveHeld = false;
  let jumpPressed = false, usePressed = false;
  let remoteInput = { left:false, right:false, jump:false, use:false, ax:0, ay:0, dive:false };
  let G = null;
  let raf = 0;
  let lastTs = 0;
  let frameN = 0;
  let particles = [];
  let clouds = [];
  let judges = [];
  let toastT = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.style.opacity = "1";
    toastT = 120;
  }
  function isMobile() {
    return matchMedia("(pointer:coarse)").matches || "ontouchstart" in window || innerWidth < 820;
  }
  function resize() {
    const r = Math.min(innerWidth / W, innerHeight / H);
    canvas.style.width = (W * r) + "px";
    canvas.style.height = (H * r) + "px";
  }
  addEventListener("resize", resize);
  resize();
  for (let i = 0; i < 7; i++) {
    clouds.push({
      x: Math.random() * W, y: 40 + Math.random() * 220,
      s: 0.6 + Math.random() * 1.1, v: 0.15 + Math.random() * 0.25
    });
  }
  function stageDef(id) {
    const ww = 2400, wh = 1280;
    const ground = { x: 320, y: 980, w: 1760, h: 52, kind: "ground" };
    const sideL = { x: 0, y: 980, w: 320, h: 300, kind: "side", owner: 0 };
    const sideR = { x: 2080, y: 980, w: 320, h: 300, kind: "side", owner: 1 };
    if (id === 0) {
      return {
        name: "Quadra", ww, wh,
        platforms: [ground],
        sides: [sideL, sideR],
        trampolines: [],
        walls: [],
        sky: ["#1a1524", "#2a2238"]
      };
    }
    if (id === 1) {
      return {
        name: "Plataformas", ww, wh,
        platforms: [
          ground,
          { x: 160, y: 620, w: 440, h: 36, kind: "float", oneWay: true },
          { x: 1800, y: 620, w: 440, h: 36, kind: "float", oneWay: true },
          { x: 940, y: 380, w: 520, h: 34, kind: "float", oneWay: true }
        ],
        sides: [sideL, sideR],
        trampolines: [],
        walls: [],
        sky: ["#16121f", "#262033"]
      };
    }
    if (id === 2) {
      return {
        name: "Trampolins", ww, wh,
        platforms: [ground],
        sides: [sideL, sideR],
        trampolines: [
          { x: 320, y: 964, w: 240, h: 18 },
          { x: 1840, y: 964, w: 240, h: 18 }
        ],
        walls: [],
        sky: ["#14111c", "#243028"]
      };
    }
    return {
      name: "Paredes", ww, wh,
      platforms: [ground],
      sides: [sideL, sideR],
      trampolines: [{ x: 1040, y: 820, w: 320, h: 20 }],
      walls: [
        { x: 620, y: 430, w: 32, h: 380 },
        { x: 1748, y: 430, w: 32, h: 380 }
      ],
      sky: ["#121018", "#2a2030"]
    };
  }
  function newPlayer(i, x) {
    return {
      i, x, y: 600, vx: 0, vy: 0, w: 44, h: 60,
      onGround: false, face: 1, coyote: 0, jumpBuf: 0,
      aimT: 0, aimX: 0, aimY: -1, cooling: 0,
      jumps: 1, canDive: true, diving: false, getup: 0,
      hanging: false, hangSide: 0, onWall: 0,
      jumpPrev: false, leftPrev: false, rightPrev: false,
      lastDir: 0, lastDirT: -999,
      respawnT: 0, aiWait: 0, aiTX: x, aiTY: 400,
      punchT: 0, punchKind: "idle", punchPow: 0,
      fistL: { x: 0, y: 0 }, fistR: { x: 0, y: 0 },
      combo: 0, lastHitF: 0
    };
  }
  function newBalloon(owner) {
    return {
      x: W / 2, y: 210, vx: (Math.random() * 2 - 1) * 1.4, vy: 0.4,
      r: 26, owner, alive: true, rot: 0, spin: (Math.random() * 2 - 1) * 0.08
    };
  }
  function formatTime(sec) {
    sec = Math.max(0, Math.ceil(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ":" + String(s).padStart(2, "0");
  }
  function formOn(g) {
    return !!(g && g.formMode);
  }
  function pushJudge(g, i, key, x, y) {
    const j = JUDGE[key];
    if (!j || !g || !g.formMode) return;
    const mult = 1 + Math.min(8, (g.players[i].combo || 0)) * 0.15;
    const add = Math.round(j.pts * mult);
    g.style[i] += add;
    g.players[i].combo = (g.players[i].combo || 0) + 1;
    g.players[1 - i].combo = 0;
    judges.push({
      text: j.label + " +" + add,
      color: j.color,
      x: x, y: y,
      life: 70,
      i
    });
  }
  function resetRound(g, keepScore) {
    const ww = g.stage.ww || 2400;
    const spawn = [ww * 0.28, ww * 0.68];
    g.players[0].x = spawn[0]; g.players[0].y = 880;
    g.players[1].x = spawn[1]; g.players[1].y = 880;
    g.players.forEach(p => {
      p.vx = 0; p.vy = 0; p.aimT = 0; p.cooling = 0;
      p.jumps = 1; p.canDive = true; p.diving = false; p.getup = 0;
      p.hanging = false; p.hangSide = 0; p.onWall = 0; p.respawnT = 0;
      p.punchT = 0; p.punchKind = "idle";
    });
    const owner = (Math.random() < 0.5) ? 0 : 1;
    g.balloon = newBalloon(owner);
    g.balloon.x = ww / 2;
    g.balloon.y = 360;
    g.cam = { x: ww / 2, y: 720, z: 0.7 };
    g.freeze = 90;
    g.slow = 1;
    g.stage = stageDef(g.stageId);
    g.flash = 0;
    g.rally = 0;
    if (!keepScore) {
      g.score = [0, 0];
      g.style = [0, 0];
      g.players[0].combo = 0;
      g.players[1].combo = 0;
    }
  }
  function createGame(opts) {
    const sid = opts.stageId != null ? opts.stageId : selectedStage;
    const mins = opts.minutes != null ? opts.minutes : selectedMinutes;
    const g = {
      stageId: sid,
      score: [0, 0],
      style: [0, 0],
      minutes: mins,
      timeLeft: mins * 60,
      freeze: 90,
      slow: 1,
      over: false,
      winner: -1,
      mode: opts.mode,
      difficulty: opts.difficulty || "medio",
      players: [newPlayer(0, 280), newPlayer(1, 1000)],
      balloon: newBalloon(0),
      lastPoint: -1,
      flash: 0,
      rally: 0,
      overtime: false,
      formMode: opts.formMode != null ? !!opts.formMode : formOpt,
      groundPop: opts.groundPop != null ? !!opts.groundPop : groundPopOpt,
      cam: { x: 1200, y: 720, z: 0.7 }
    };
    g.stage = stageDef(sid);
    resetRound(g, false);
    return g;
  }
  function totalOf(g, i) {
    if (formOn(g)) return (g.score[i] * 200) + (g.style[i] || 0);
    return g.score[i];
  }
  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    const d2 = dx * dx + dy * dy;
    if (d2 > r * r) return null;
    const d = Math.sqrt(d2) || 0.0001;
    return { nx: dx / d, ny: dy / d, pen: r - d, px: nx, py: ny };
  }
  function spawnHit(x, y, color) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 1 + Math.random() * 3;
      particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
        life: 28 + Math.random() * 16, color, r: 2 + Math.random() * 3
      });
    }
  }
  function inEnemyArea(p, x) {
    return p.i === 0 ? x > 1200 : x < 1200;
  }
  function classifyHit(g, p, dirx, diry, simple) {
    const b = g.balloon;
    const pcx = p.x + p.w / 2;
    const pcy = p.y + p.h * 0.45;
    const behind = (b.x - pcx) * p.face < -8;
    const groundY = 980;
    const nearFloor = b.y + b.r > groundY - 90;
    const fromBelow = b.y > p.y + p.h * 0.55;
    const highGrab = b.y < p.y - 8;
    const prevOwner = b.owner;
    const down = !simple && diry > 0.42;
    const keys = [];
    if (p.diving && prevOwner !== p.i) keys.push("MERGDEFESA");
    else if (prevOwner !== p.i) keys.push("DEFESA");
    if (behind) keys.push("COSTAS");
    if (down && inEnemyArea(p, b.x)) keys.push("DOWNSMASH");
    if (fromBelow && nearFloor) keys.push("SALVOBAIXO");
    else if (nearFloor) keys.push("SALVAMENTO");
    if (highGrab) keys.push("PEGADAALTA");
    if (prevOwner === p.i && !p.diving) keys.push("CONTROLE");
    const priority = ["MERGDEFESA","DOWNSMASH","SALVOBAIXO","SALVAMENTO","PEGADAALTA","DEFESA","COSTAS","CONTROLE"];
    const pick = priority.find(k => keys.includes(k)) || "CONTROLE";
    pushJudge(g, p.i, pick, b.x, b.y - 30);
    p.punchT = 16;
    if (behind) p.punchKind = "back";
    else if (simple) p.punchKind = "neutral";
    else if (diry < -0.35) p.punchKind = "up";
    else if (diry > 0.25) p.punchKind = "down";
    else p.punchKind = "fwd";
    p.punchPow = simple ? 0.45 : 1;
  }
  function applyHit(g, p, dirx, diry, power, simple) {
    const b = g.balloon;
    classifyHit(g, p, dirx, diry, simple);
    b.owner = p.i;
    g.rally = (g.rally || 0) + 1;
    p.lastHitF = frameN;
    const mag = Math.hypot(dirx, diry) || 1;
    let dx = dirx / mag, dy = diry / mag;
    if (simple) { dx = 0; dy = -1; power *= 0.38; }
    const impact = power;
    b.vx = b.vx * 0.22 + dx * impact;
    b.vy = b.vy * 0.18 + dy * impact;
    const extra = Math.min(8, Math.hypot(p.vx, p.vy) * 0.45);
    b.vx += p.vx * 0.35 + (p.face * extra * 0.15);
    b.vy += p.vy * 0.2;
    if (!simple && dy > 0.55 && impact > 8) {
      const side = Math.sign(b.x - (p.x + p.w / 2)) || p.face;
      b.vx += side * (0.55 + Math.random() * 0.7);
      b.spin += side * 0.18;
    }
    b.spin += (dx * 0.18) + (p.face * 0.22) + (simple ? 0.06 : 0.35);
    const lim = 16;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > lim) { b.vx = b.vx / sp * lim; b.vy = b.vy / sp * lim; }
    spawnHit(b.x, b.y, COLORS[p.i].light);
    p.cooling = 18;
  }
  function startAim(p) {
    if (p.aimT > 0 || p.cooling > 0) return;
    p.aimT = 42;
    p.aimX = 0; p.aimY = 0;
  }
  function playerInput(p, isLocal) {
    let left, right, jump, use, ax, ay;
    if (isLocal) {
      left = !!(keys["ArrowLeft"] || keys["a"] || keys["A"]) || joy.x < -0.25;
      right = !!(keys["ArrowRight"] || keys["d"] || keys["D"]) || joy.x > 0.25;
      jump = jumpHeld || !!(keys["ArrowUp"] || keys["w"] || keys["W"] || keys["z"] || keys["Z"] || keys[" "]);
      use = useHeld || !!(keys["x"] || keys["X"]);
      ax = Math.abs(joy.x) > 0.2 ? joy.x : ((keys["ArrowLeft"]||keys["a"]) ? -1 : 0) + ((keys["ArrowRight"]||keys["d"]) ? 1 : 0);
      ay = Math.abs(joy.y) > 0.2 ? joy.y : ((keys["ArrowUp"]||keys["w"]) ? -1 : 0) + ((keys["ArrowDown"]||keys["s"]) ? 1 : 0);
      if (keys["ArrowLeft"] || keys["a"]) ax = -1;
      if (keys["ArrowRight"] || keys["d"]) ax = 1;
      if (keys["ArrowUp"] || keys["w"]) ay = -1;
      if (keys["ArrowDown"] || keys["s"]) ay = 1;
    } else if (mode === "pvp") {
      left = remoteInput.left; right = remoteInput.right;
      jump = remoteInput.jump; use = remoteInput.use;
      ax = remoteInput.ax; ay = remoteInput.ay;
    } else {
      return aiControl(p);
    }
    const down = ay > 0.45;
    const dive = !!(isLocal && diveHeld) || !!(mode === "pvp" && !isLocal && remoteInput.dive);
    return { left, right, jump, use, ax, ay, down, dive };
  }
  function aiControl(p) {
    const idle = { left:false, right:false, jump:false, use:false, ax:0, ay:-1, down:false, dive:false };
    if (p.respawnT > 0 || p.getup > 0 || !G.balloon.alive) return idle;
    const b = G.balloon;
    const other = G.players[1 - p.i];
    const diff = G.difficulty;
    const cfg = diff === "facil"
      ? { react: 26, err: 110, useCh: 0.32, look: 5, jumpCh: 0.14, noise: 0.85, range: 78, dive: 0 }
      : diff === "impossivel"
      ? { react: 2, err: 3, useCh: 0.98, look: 20, jumpCh: 0.92, noise: 0.04, range: 108, dive: 0.55 }
      : diff === "dificil"
      ? { react: 7, err: 16, useCh: 0.86, look: 14, jumpCh: 0.48, noise: 0.16, range: 92, dive: 0.12 }
      : { react: 14, err: 48, useCh: 0.62, look: 9, jumpCh: 0.3, noise: 0.4, range: 86, dive: 0.06 };
    p.aiWait = (p.aiWait || 0) - 1;
    if (p.aiWait <= 0) {
      p.aiWait = cfg.react + Math.floor(Math.random() * cfg.react);
      p.aiTX = b.x + b.vx * cfg.look + (Math.random() - 0.5) * cfg.err;
      p.aiTY = b.y + b.vy * cfg.look * 0.6;
    }
    let left = false, right = false, jump = false, use = false, ax = 0, ay = -1;
    const mine = b.owner === p.i;
    const pcx = p.x + p.w / 2;
    if (pcx < p.aiTX - 22) right = true;
    else if (pcx > p.aiTX + 22) left = true;

      difficulty = a.slice(3);
      menuTime("to-stage-pve");
    } else if (a === "to-stage-pve") menuStage("start-pve");
    else if (a === "pvp-time") { mode = "pvp"; menuTime("pvp-stage"); }
    else if (a === "pvp-stage") menuStage("host");
    else if (a.startsWith("time-")) {
      selectedMinutes = Number(a.slice(5));
      if (mode === "pvp") menuTime("pvp-stage");
      else menuTime("to-stage-pve");
    } else if (a.startsWith("stage-")) {
      selectedStage = Number(a.slice(6));
      menuStage(stageNext);
    } else if (a === "start-pve") startLocal();
    else if (a === "host") startHost();
    else if (a === "join") startJoin();
    else if (a === "copy") {
      if (myPeerId) navigator.clipboard?.writeText(myPeerId);
      toast("ID copiado");
    } else if (a === "dojoin") {
      const id = document.getElementById("joinId")?.value.trim();
      if (id) connectTo(id);
    } else if (a === "again") {
      if (mode === "pve") startLocal();
      else if (netReady && isHost) {
        G = createGame({ mode: "pvp", stageId: selectedStage, minutes: selectedMinutes, formMode: formOpt, groundPop: groundPopOpt });
        screen = STATE.GAME;
        showUI("");
        if (isMobile()) touchLayer.classList.remove("hidden");
        try { conn.send({ t: "start", game: snapshot() }); } catch (e) {}
      } else menuPvp();
    } else if (a === "change-stage") {
      if (mode === "pve") menuStage("start-pve");
      else menuStage("host");
    }
  }
  function startLocal() {
    mode = "pve";
    isHost = true;
    localIndex = 0;
    paused = false;
    G = createGame({ mode, difficulty, minutes: selectedMinutes, formMode: formOpt, groundPop: groundPopOpt });
    screen = STATE.GAME;
    showUI("");
    btnPause.classList.remove("hidden");
    if (isMobile()) touchLayer.classList.remove("hidden");
  }
  function pauseGame() {
    if (screen !== STATE.GAME || !G || mode !== "pve" || G.over) return;
    paused = true;
    showUI(`
      <h1>Pausa</h1>
      <p class="sub">${formatTime(G.timeLeft)} · ${G.stage.name}</p>
      <button class="menu primary" data-a="resume">Continuar</button>
      <button class="menu ghost" data-a="back">Menu</button>
    `);
    bindUI();
  }
  function resumeGame() {
    paused = false;
    showUI("");
  }
  function showResult() {
    screen = STATE.RESULT;
    paused = false;
    btnPause.classList.add("hidden");
    touchLayer.classList.add("hidden");
    const w = G.winner;
    const youWin = mode === "pve" ? w === 0 : w === localIndex;
    const t0 = totalOf(G, 0), t1 = totalOf(G, 1);
    const formTxt = G.formMode
      ? `<br>quedas ${G.score[0]}-${G.score[1]} · forma ${G.style[0]}-${G.style[1]}`
      : "";
    showUI(`
      <h1>${youWin ? "Você venceu!" : "Fim de jogo"}</h1>
      <p class="sub">${COLORS[w].name} ${G.formMode ? "fez mais pontos de forma + queda" : "fez mais quedas"}</p>
      <p class="peerid">${t0} x ${t1}${formTxt}<br>${G.minutes} min · ${G.stage.name}</p>
      <button class="menu primary" data-a="again">Jogar de novo nesta fase</button>
      <button class="menu" data-a="change-stage">Trocar fase</button>
      <button class="menu ghost" data-a="back">Menu</button>
    `);
    bindUI();
  }
  function closePeer() {
    try { conn && conn.close(); } catch(e) {}
    try { peer && peer.destroy(); } catch(e) {}
    peer = null; conn = null; netReady = false; myPeerId = "";
  }
  function startHost() {
    closePeer();
    btnPause.classList.add("hidden");
    mode = "pvp";
    isHost = true;
    localIndex = 0;
    showUI(`<h1>Criando sala…</h1><p class="sub">falando com o PeerJS</p>`);
    try {
      peer = new Peer();
    } catch (e) {
      showUI(`<h1>Erro</h1><p class="sub">PeerJS não carregou</p><button class="menu" data-a="back">Voltar</button>`);
      bindUI();
      return;
    }
    peer.on("open", id => {
      myPeerId = id;
      showUI(`
        <h1>Sala criada</h1>
        <p class="sub">envie este ID para o amigo</p>
        <div class="peerid">${id}</div>
        <button class="menu primary" data-a="copy">Copiar ID</button>
        <p class="hint">esperando o outro jogador entrar…</p>
        <button class="menu ghost" data-a="back">Cancelar</button>
      `);
      bindUI();
    });
    peer.on("connection", c => {
      conn = c;
      setupConn();
    });
    peer.on("error", err => toast("Erro de rede: " + (err.type || err)));
  }
  function startJoin() {
    closePeer();
    btnPause.classList.add("hidden");
    mode = "pvp";
    isHost = false;
    localIndex = 1;
    showUI(`
      <h1>Entrar</h1>
      <p class="sub">cole o ID da sala</p>
      <input class="id" id="joinId" placeholder="id-do-amigo" autocomplete="off">
      <button class="menu primary" data-a="dojoin">Conectar</button>
      <button class="menu ghost" data-a="back">Voltar</button>
    `);
    bindUI();
  }
  function connectTo(id) {
    showUI(`<h1>Conectando…</h1><p class="sub">${id}</p>`);
    try { peer = new Peer(); } catch(e) { toast("PeerJS indisponível"); return; }
    peer.on("open", () => {
      conn = peer.connect(id, { reliable: true });
      setupConn();
    });
    peer.on("error", err => toast("Erro: " + (err.type || err)));
  }
  function setupConn() {
    conn.on("open", () => {
      netReady = true;
      toast("Conectado!");
      if (isHost) {
        G = createGame({ mode: "pvp", minutes: selectedMinutes, stageId: selectedStage, formMode: formOpt, groundPop: groundPopOpt });
        screen = STATE.GAME;
        showUI("");
        if (isMobile()) touchLayer.classList.remove("hidden");
        conn.send({ t: "start", game: snapshot() });
      }
    });
    conn.on("data", onNet);
    conn.on("close", () => { toast("Conexão encerrada"); netReady = false; });
  }
  function snapshot() {
    return {
      score: G.score.slice(),
      style: (G.style || [0, 0]).slice(),
      minutes: G.minutes,
      timeLeft: G.timeLeft,
      stageId: G.stageId,
      freeze: G.freeze,
      over: G.over,
      winner: G.winner,
      rally: G.rally,
      formMode: !!G.formMode,
      groundPop: !!G.groundPop,
      overtime: !!G.overtime,
      cam: G.cam ? { ...G.cam } : null,
      players: G.players.map(p => ({
        i: p.i, x: p.x, y: p.y, vx: p.vx, vy: p.vy, face: p.face, aimT: p.aimT, aimX: p.aimX, aimY: p.aimY, cooling: p.cooling,
        jumps: p.jumps, canDive: p.canDive, diving: p.diving, getup: p.getup, hanging: p.hanging, hangSide: p.hangSide, onGround: p.onGround,
        respawnT: p.respawnT, punchT: p.punchT, punchKind: p.punchKind, combo: p.combo,
        fistL: p.fistL, fistR: p.fistR
      })),
      balloon: { ...G.balloon }
    };
  }
  function applySnap(s) {
    if (!G) G = createGame({ mode: "pvp" });
    G.score = s.score;
    G.style = s.style || [0, 0];
    G.minutes = s.minutes || G.minutes;
    G.timeLeft = s.timeLeft != null ? s.timeLeft : G.timeLeft;
    G.stageId = s.stageId;
    G.stage = stageDef(s.stageId);
    G.freeze = s.freeze;
    G.over = s.over;
    G.winner = s.winner;
    G.rally = s.rally || 0;
    G.formMode = !!s.formMode;
    G.groundPop = !!s.groundPop;
    G.overtime = !!s.overtime;
    s.players.forEach((sp, i) => Object.assign(G.players[i], sp));
    Object.assign(G.balloon, s.balloon);
    if (s.cam) G.cam = s.cam;
    if (s.over && screen === STATE.GAME) showResult();
  }
  function sendState() {
    try { conn.send({ t: "state", game: snapshot() }); } catch(e) {}
  }
  function sendInput() {
    const ax = joy.active ? joy.x : (keys["ArrowLeft"]?-1:0)+(keys["ArrowRight"]?1:0);
    const ay = joy.active ? joy.y : (keys["ArrowUp"]?-1:0)+(keys["ArrowDown"]?1:0);
    try {
      conn.send({
        t: "input",
        left: !!(keys["ArrowLeft"] || keys["a"]) || joy.x < -0.25,
        right: !!(keys["ArrowRight"] || keys["d"]) || joy.x > 0.25,
        jump: jumpHeld || !!(keys["ArrowUp"] || keys["z"] || keys["Z"] || keys[" "]),
        use: useHeld || !!(keys["x"] || keys["X"]),
        dive: diveHeld,
        ax, ay
      });
    } catch(e) {}
  }
  function onNet(msg) {
    if (!msg || !msg.t) return;
    if (msg.t === "start" || msg.t === "state") {
      applySnap(msg.game);
      if (screen !== STATE.GAME && !msg.game.over) {
        screen = STATE.GAME;
        showUI("");
        if (isMobile()) touchLayer.classList.remove("hidden");
      }
    } else if (msg.t === "input" && isHost) {
      remoteInput = msg;
    }
  }
  addEventListener("keydown", e => {
    keys[e.key] = true;
    if (e.key === "Escape") {
      if (paused) resumeGame();
      else pauseGame();
    }
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  });
  btnPause.addEventListener("click", () => {
    if (paused) resumeGame();
    else pauseGame();
  });
  addEventListener("keyup", e => { keys[e.key] = false; });
  function setJoy(clientX, clientY) {
    const r = stickBase.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = clientX - cx, dy = clientY - cy;
    const max = r.width * 0.36;
    const mag = Math.hypot(dx, dy);
    if (mag > max) { dx = dx / mag * max; dy = dy / mag * max; }
    joy.x = dx / max; joy.y = dy / max; joy.active = true;
    stickKnob.style.left = (35 + dx * 0.7) + "px";
    stickKnob.style.top = (35 + dy * 0.7) + "px";
  }
  function resetJoy() {
    joy.x = 0; joy.y = 0; joy.active = false;
    stickKnob.style.left = "35px"; stickKnob.style.top = "35px";
  }
  let stickTouch = null;
  stickBase.addEventListener("touchstart", e => {
    const t = e.changedTouches[0];
    stickTouch = t.identifier;
    setJoy(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });
  addEventListener("touchmove", e => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickTouch) setJoy(t.clientX, t.clientY);
    }
  }, { passive: false });
  addEventListener("touchend", e => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickTouch) { stickTouch = null; resetJoy(); }
    }
  });
  btnJump.addEventListener("touchstart", e => { jumpHeld = true; e.preventDefault(); }, { passive: false });
  btnJump.addEventListener("touchend", () => { jumpHeld = false; });
  btnUse.addEventListener("touchstart", e => { useHeld = true; e.preventDefault(); }, { passive: false });
  btnUse.addEventListener("touchend", () => { useHeld = false; });
  btnDive.addEventListener("touchstart", e => { diveHeld = true; e.preventDefault(); }, { passive: false });
  btnDive.addEventListener("touchend", () => { diveHeld = false; });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { Object.keys(keys).forEach(k => keys[k] = false); resetJoy(); jumpHeld = useHeld = diveHeld = false; }
  });
  menuMain();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
