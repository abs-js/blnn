    position: fixed; inset: 0; pointer-events: none;

  }

    pointer-events: auto;
    background: linear-gradient(180deg, rgba(15,23,42,.92), rgba(15,23,42,.86));

    box-shadow: 0 20px 60px rgba(0,0,0,.45);

    width: min(420px, calc(100vw - 28px));
    text-align: center;
    backdrop-filter: blur(10px);
  }
  h1 {
    margin: 0 0 6px; font-size: 34px; letter-spacing: -0.5px;
    background: linear-gradient(90deg, #38bdf8, #fb7185, #fb923c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: #94a3b8; margin: 0 0 18px; font-size: 14px; }
  button.menu {
    display: block; width: 100%; margin: 8px 0; padding: 12px 16px;
    border: 0; border-radius: 12px; font-size: 16px; font-weight: 700;
    cursor: pointer; color: #0f172a; background: #e2e8f0;
  }
  button.menu.primary { background: #38bdf8; }
  button.menu.p1 { background: #60a5fa; }
  button.menu.p2 { background: #fb923c; }
  button.menu.ghost { background: transparent; color: #cbd5e1; border: 1px solid rgba(255,255,255,.15); }
  button.menu:active { transform: scale(.98); }
  input.id {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid #334155;
    background: #0b1220; color: #f8fafc; font-size: 15px; margin: 8px 0 4px; text-align: center;
  }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  .hint { font-size: 12px; color: #94a3b8; line-height: 1.4; margin-top: 10px; text-align: left; }
  .peerid { font-family: ui-monospace, monospace; background: #0b1220; padding: 8px; border-radius: 8px; word-break: break-all; }
  #mapPrev { width: 100%; height: 132px; border-radius: 12px; background: #0b1220; display: block; margin: 8px 0 12px; }
  #touch {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
  }
  .stick-base, .btn-act {
    pointer-events: auto; position: absolute; border-radius: 999px;
  }
  #stickBase {
    left: 28px; bottom: 28px; width: 128px; height: 128px;
    background: rgba(15,23,42,.35); border: 2px solid rgba(255,255,255,.22);
  }
  #stickKnob {
    position: absolute; width: 58px; height: 58px; border-radius: 999px;
    background: rgba(226,232,240,.9); left: 35px; top: 35px;
    box-shadow: 0 6px 16px rgba(0,0,0,.3);

  #btnJump {

    background: rgba(56,189,248,.82); border: 2px solid rgba(255,255,255,.35);

    font-size: 13px;

    background: rgba(15,23,42,.85); padding: 8px 14px; border-radius: 999px;
    font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .2s;

    x.font = "700 12px Trebuchet MS, sans-serif";
    x.textAlign = "center";
    x.fillText(stageNameOf(st), c.width / 2, 16);
  }
  function menuPvp() {
    showUI(`
      <h1>${t("pvp")}</h1>
      <p class="sub">${t("pvp_sub")}</p>
      <button class="menu primary" data-a="host">${t("host")}</button>
      <button class="menu" data-a="join">${t("join")}</button>
      <button class="menu ghost" data-a="back">${t("back")}</button>
    `);
    bindUI();
  }
  function menuHow() {
    showUI(`
      <h1>${t("how")}</h1>
      <div class="hint">
        ${t("how_c")}<br>${t("how_v")}<br>${t("how_k")}<br><br>
        ${t("how_d")}<br>${t("how_h")}<br>${t("how_a")}<br><br>
        ${t("how_pc")}<br>${t("how_ph")}
      </div>
      <button class="menu primary" data-a="back">${t("ok")}</button>
    `);
    bindUI();
  }
  function bindUI() {
    ui.querySelectorAll("[data-a]").forEach(btn => {
      btn.addEventListener("click", () => onAction(btn.getAttribute("data-a")));
    });
  }
  function gameOpts(m, extra) {
    return Object.assign({
      mode: m,
      difficulty,
      minutes: selectedMinutes,
      formMode: formOpt,
      gameMode,
      matchKind,
      bestOf,
      stageId: selectedStage,
      format: gameFormat,
      aiDiffs: aiDiffs.slice()
    }, extra || {});
  }
  function onAction(a) {
    sfx("ui");
    if (a === "play") menuPlay();
    else if (a === "path-pve") { playPath = "pve"; mode = "pve"; menuFormat(); }
    else if (a === "path-pvp") { playPath = "pvp"; mode = "pvp"; menuFormat(); }
    else if (a === "treino") { playPath = "treino"; menuStage("start-treino"); }
    else if (a === "pvp") menuPvp();
    else if (a === "how") menuHow();
    else if (a === "fmt-1v1") { gameFormat = "1v1"; menuFormat(); }
    else if (a === "fmt-2v2") { gameFormat = "2v2"; menuFormat(); }
    else if (a === "to-mode") menuMode();
    else if (a.startsWith("gm-")) { gameMode = a.slice(3); menuMode(); }
    else if (a === "to-rules") menuRules();
    else if (a === "toggle-form") { formOpt = !formOpt; menuRules(); }
    else if (a === "mk-time") { matchKind = "time"; menuRules(); }
    else if (a === "mk-best") { matchKind = "best"; menuRules(); }
    else if (a.startsWith("best-")) { bestOf = Number(a.slice(5)); matchKind = "best"; menuRules(); }
    else if (a === "to-map") menuStage(playPath === "pvp" ? (gameFormat === "2v2" ? "ai-or-start" : "pvp-next") : "ai-or-start");
    else if (a === "pvp-next") menuPvp();
    else if (a === "ai-or-start") menuDiff();
    else if (a === "start-now") {
      if (playPath === "pvp") menuPvp();
      else startLocal();
    } else if (a.startsWith("aid-")) {
      const parts = a.split("-");
      aiDiffs[Number(parts[1])] = parts[2];
      difficulty = aiDiffs[1] || difficulty;
      menuDiff();
    }
    else if (a === "resume") resumeGame();
    else if (a === "back") { closePeer(); paused = false; menuMain(); }
    else if (a.startsWith("go-")) {
      difficulty = a.slice(3);
      startLocal();
    } else if (a.startsWith("time-")) {
      selectedMinutes = Number(a.slice(5));
      matchKind = "time";
      menuRules();
    } else if (a.startsWith("stage-")) {
      selectedStage = Number(a.slice(6));
      menuStage(stageNext);
    } else if (a === "start-pve" || a === "start-treino") {
      if (a === "start-treino") startTraining();
      else startLocal();
    } else if (a === "host") startHost();
    else if (a === "join") startJoin();
    else if (a === "copy") {
      if (myPeerId) navigator.clipboard?.writeText(myPeerId);
      toast(t("copy"));
    } else if (a === "dojoin") {
      const id = document.getElementById("joinId")?.value.trim();
      if (id) connectTo(id);
    } else if (a === "again") {
      if (playPath === "treino") startTraining();
      else if (mode === "pve") startLocal();
      else if (netReady && isHost) {
        G = createGame(gameOpts("pvp"));
        screen = STATE.GAME;
        showUI("");
        if (isMobile()) touchLayer.classList.remove("hidden");
        try { conn.send({ t: "start", game: snapshot() }); } catch (e) {}
      } else menuPvp();
    } else if (a === "change-stage") {
      menuStage(playPath === "pvp" ? "pvp-next" : (playPath === "treino" ? "start-treino" : "ai-or-start"));
    }
  }
  function startLocal() {
    mode = "pve";
    playPath = "pve";
    isHost = true;
    localIndex = 0;
    paused = false;
    G = createGame(gameOpts("pve"));
    screen = STATE.GAME;
    showUI("");
    btnPause.classList.remove("hidden");
    if (isMobile()) touchLayer.classList.remove("hidden");
    sfx("whistle");
  }
  function startTraining() {
    mode = "pve";
    playPath = "treino";
    isHost = true;
    localIndex = 0;
    paused = false;
    G = createGame(gameOpts("pve", { training: true }));
    screen = STATE.GAME;
    showUI("");
    btnPause.classList.remove("hidden");
    if (isMobile()) touchLayer.classList.remove("hidden");
  }
  function pauseGame() {
    if (screen !== STATE.GAME || !G || mode !== "pve" || G.over) return;
    paused = true;
    showUI(`
      <h1>${t("pause")}</h1>
      <p class="sub">${formatTime(G.timeLeft)} · ${stageNameOf(G.stage)}</p>
      <button class="menu primary" data-a="resume">${t("resume")}</button>
      <button class="menu ghost" data-a="back">${t("menu")}</button>
    `);
    bindUI();
  }
  function resumeGame() {
    paused = false;
    showUI("");
  }
  function showResult() {
    screen = STATE.RESULT;
    paused = false;
    btnPause.classList.add("hidden");
    touchLayer.classList.add("hidden");
    const w = G.winner;
    const youWin = mode === "pve" ? w === 0 : w === localIndex;
    const t0 = totalOf(G, 0), t1 = totalOf(G, 1);
    const formTxt = G.formMode
      ? `<br>${G.score[0]}-${G.score[1]} · ${t("form_hud")} ${G.style[0]}-${G.style[1]}`
      : "";
    showUI(`
      <h1>${youWin ? t("win") : t("lose")}</h1>
      <p class="sub">${w === 0 ? t("blue") : t("orange")} ${G.formMode ? t("more_form") : t("more_falls")}</p>
      <p class="peerid">${t0} x ${t1}${formTxt}<br>${G.minutes} ${t("min")} · ${stageNameOf(G.stage)}</p>
      <button class="menu primary" data-a="again">${t("again")}</button>
      <button class="menu" data-a="change-stage">${t("change")}</button>
      <button class="menu ghost" data-a="back">${t("menu")}</button>
    `);
    bindUI();
  }
  function closePeer() {
    try { conn && conn.close(); } catch(e) {}
    try { peer && peer.destroy(); } catch(e) {}
    peer = null; conn = null; netReady = false; myPeerId = "";
  }
  function startHost() {
    closePeer();
    btnPause.classList.add("hidden");
    mode = "pvp";
    isHost = true;
    localIndex = 0;
    showUI(`<h1>${t("creating")}</h1><p class="sub">${t("talking")}</p>`);
    try {
      peer = new Peer();
    } catch (e) {
      showUI(`<h1>${t("err")}</h1><p class="sub">${t("peer_fail")}</p><button class="menu" data-a="back">${t("back")}</button>`);
      bindUI();
      return;
    }
    peer.on("open", id => {
      myPeerId = id;
      showUI(`
        <h1>${t("room")}</h1>
        <p class="sub">${t("send_id")}</p>
        <div class="peerid">${id}</div>
        <button class="menu primary" data-a="copy">${t("copy")}</button>
        <p class="hint">${t("wait")}</p>
        <button class="menu ghost" data-a="back">${t("back")}</button>
      `);
      bindUI();
    });
    peer.on("connection", c => {
      conn = c;
      setupConn();
    });
    peer.on("error", err => toast("Erro de rede: " + (err.type || err)));
  }
  function startJoin() {
    closePeer();
    btnPause.classList.add("hidden");
    mode = "pvp";
    isHost = false;
    localIndex = 1;
    showUI(`
      <h1>${t("enter")}</h1>
      <p class="sub">${t("send_id")}</p>
      <input class="id" id="joinId" placeholder="id" autocomplete="off">
      <button class="menu primary" data-a="dojoin">${t("enter")}</button>
      <button class="menu ghost" data-a="back">${t("back")}</button>
    `);
    bindUI();
  }
  function connectTo(id) {
    showUI(`<h1>${t("joining")}</h1><p class="sub">${id}</p>`);
    try { peer = new Peer(); } catch(e) { toast("PeerJS indisponível"); return; }
    peer.on("open", () => {
      conn = peer.connect(id, { reliable: true });
      setupConn();
    });
    peer.on("error", err => toast("Erro: " + (err.type || err)));
  }
  function setupConn() {
    conn.on("open", () => {
      netReady = true;
      toast("Conectado!");
      if (isHost) {
        G = createGame(gameOpts("pvp"));
        screen = STATE.GAME;
        showUI("");
        if (isMobile()) touchLayer.classList.remove("hidden");
        conn.send({ t: "start", game: snapshot() });
      }
    });
    conn.on("data", onNet);
    conn.on("close", () => { toast("Conexão encerrada"); netReady = false; });
  }
  function snapshot() {
    return {
      score: G.score.slice(),
      style: (G.style || [0, 0]).slice(),
      minutes: G.minutes,
      timeLeft: G.timeLeft,
      stageId: G.stageId,
      freeze: G.freeze,
      over: G.over,
      winner: G.winner,
      rally: G.rally,
      formMode: !!G.formMode,
      groundPop: !!G.groundPop,
      overtime: !!G.overtime,
      extraTime: !!G.extraTime,
      format: G.format,
      aiDiffs: (G.aiDiffs || []).slice(),
      gameMode: G.gameMode,
      matchKind: G.matchKind,
      bestOf: G.bestOf,
      hold: (G.hold || [0, 0]).slice(),
      training: !!G.training,
      cam: G.cam ? { ...G.cam } : null,
      players: G.players.map(p => ({
        i: p.i, x: p.x, y: p.y, vx: p.vx, vy: p.vy, face: p.face, aimT: p.aimT, aimX: p.aimX, aimY: p.aimY, cooling: p.cooling,
        jumps: p.jumps, canDive: p.canDive, diving: p.diving, getup: p.getup, hanging: p.hanging, hangSide: p.hangSide, onGround: p.onGround,
        respawnT: p.respawnT, punchT: p.punchT, punchKind: p.punchKind, combo: p.combo,
        fistL: p.fistL, fistR: p.fistR
      })),
      balloon: { ...G.balloon }
    };
  }
  function applySnap(s) {
    if (!G || (s.players && G.players.length !== s.players.length)) {
      G = createGame({ mode: "pvp", format: s.format || "1v1" });
    }
    G.score = s.score;
    G.style = s.style || [0, 0];
    G.minutes = s.minutes || G.minutes;
    G.timeLeft = s.timeLeft != null ? s.timeLeft : G.timeLeft;
    G.stageId = s.stageId;
    G.gameMode = s.gameMode || G.gameMode;
    G.stage = stageDef(s.stageId, G.gameMode);
    G.freeze = s.freeze;
    G.over = s.over;
    G.winner = s.winner;
    G.rally = s.rally || 0;
    G.formMode = !!s.formMode;
    G.groundPop = !!s.groundPop;
    G.overtime = !!s.overtime;
    G.extraTime = !!s.extraTime;
    G.matchKind = s.matchKind || G.matchKind;
    G.bestOf = s.bestOf != null ? s.bestOf : G.bestOf;
    G.hold = s.hold || G.hold || [0, 0];
    G.training = !!s.training;
    G.format = s.format || G.format;
    if (s.aiDiffs) G.aiDiffs = s.aiDiffs;
    s.players.forEach((sp, i) => Object.assign(G.players[i], sp));
    Object.assign(G.balloon, s.balloon);
    if (s.cam) G.cam = s.cam;
    if (s.over && screen === STATE.GAME) showResult();
  }
  function sendState() {
    try { conn.send({ t: "state", game: snapshot() }); } catch(e) {}
  }
  function sendInput() {
    const ax = joy.active ? joy.x : (keys["ArrowLeft"]?-1:0)+(keys["ArrowRight"]?1:0);
    const ay = joy.active ? joy.y : (keys["ArrowUp"]?-1:0)+(keys["ArrowDown"]?1:0);
    try {
      conn.send({
        t: "input",
        left: !!(keys["ArrowLeft"] || keys["a"]) || joy.x < -0.25,
        right: !!(keys["ArrowRight"] || keys["d"]) || joy.x > 0.25,
        jump: jumpHeld || !!(keys["ArrowUp"] || keys["z"] || keys["Z"] || keys[" "]),
        use: useHeld || !!(keys["x"] || keys["X"]),
        dive: diveHeld,
        ax, ay
      });
    } catch(e) {}
  }
  function onNet(msg) {
    if (!msg || !msg.t) return;
    if (msg.t === "start" || msg.t === "state") {
      applySnap(msg.game);
      if (screen !== STATE.GAME && !msg.game.over) {
        screen = STATE.GAME;
        showUI("");
        if (isMobile()) touchLayer.classList.remove("hidden");
      }
    } else if (msg.t === "input" && isHost) {
      remoteInput = msg;
    }
  }
  addEventListener("keydown", e => {
    keys[e.key] = true;
    if (e.key === "Escape") {
      if (paused) resumeGame();
      else pauseGame();
    }
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  });
  btnPause.addEventListener("click", () => {
    if (paused) resumeGame();
    else pauseGame();
  });
  addEventListener("keyup", e => { keys[e.key] = false; });
  function setJoy(clientX, clientY) {
    const r = stickBase.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = clientX - cx, dy = clientY - cy;
    const max = r.width * 0.36;
    const mag = Math.hypot(dx, dy);
    if (mag > max) { dx = dx / mag * max; dy = dy / mag * max; }
    joy.x = dx / max; joy.y = dy / max; joy.active = true;
    stickKnob.style.left = (35 + dx * 0.7) + "px";
    stickKnob.style.top = (35 + dy * 0.7) + "px";
  }
  function resetJoy() {
    joy.x = 0; joy.y = 0; joy.active = false;
    stickKnob.style.left = "35px"; stickKnob.style.top = "35px";
  }
  let stickTouch = null;
  stickBase.addEventListener("touchstart", e => {
    const t = e.changedTouches[0];
    stickTouch = t.identifier;
    setJoy(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });
  addEventListener("touchmove", e => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickTouch) setJoy(t.clientX, t.clientY);
    }
  }, { passive: false });
  addEventListener("touchend", e => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickTouch) { stickTouch = null; resetJoy(); }
    }
  });
  btnJump.addEventListener("touchstart", e => { jumpHeld = true; e.preventDefault(); }, { passive: false });
  btnJump.addEventListener("touchend", () => { jumpHeld = false; });
  btnUse.addEventListener("touchstart", e => { useHeld = true; e.preventDefault(); }, { passive: false });
  btnUse.addEventListener("touchend", () => { useHeld = false; });
  btnDive.addEventListener("touchstart", e => { diveHeld = true; e.preventDefault(); }, { passive: false });
  btnDive.addEventListener("touchend", () => { diveHeld = false; });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { Object.keys(keys).forEach(k => keys[k] = false); resetJoy(); jumpHeld = useHeld = diveHeld = false; }
  });
  menuMain();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
